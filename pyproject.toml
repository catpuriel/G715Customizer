[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "g715-customizer"
version = "0.1.0"
description = "Native Linux onboard memory & RGB studio for the Logitech G715 keyboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.5"]

[project.scripts]
g715 = "g715.cli:main"
g715-gui = "g715.gui.app:launch_gui"

[tool.setuptools.packages.find]
include = ["g715*"]
